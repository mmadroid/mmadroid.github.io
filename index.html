<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Монополия | Сетевая игра</title>
    <style>
        * {
            user-select: none;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b2b1f 0%, #1e3b2a 100%);
            font-family: 'Segoe UI', 'Poppins', 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }

        .game-container {
            background: #2b2b2b;
            border-radius: 48px;
            box-shadow: 0 30px 40px rgba(0,0,0,0.6);
            padding: 20px;
        }

        .game-wrapper {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .board {
            background: #f7e9cd;
            border-radius: 28px;
            padding: 12px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(11, 70px);
            grid-template-rows: repeat(11, 70px);
            background-color: #e0cba0;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .cell {
            background-color: #f3e5c0;
            border: 1px solid #b57a3b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            position: relative;
            transition: 0.1s linear;
            cursor: pointer;
        }

        .cell:hover {
            filter: brightness(0.95);
        }

        /* Цвета клеток */
        .brown { background: #b97f5c; color: white; }
        .lightblue { background: #9fd9ff; color: #1e2a2e; }
        .pink { background: #f5a9b8; color: #2c2c2c; }
        .orange { background: #ffb347; color: #2c2c2c; }
        .red { background: #e55a4f; color: white; }
        .yellow { background: #ffd966; color: #2c2c2c; }
        .green { background: #6fbf4c; color: white; }
        .darkblue { background: #2a6f8f; color: white; }
        .station { background: #5a5a5a; color: white; }
        .utility { background: #c0c0c0; color: #111; }
        .chance { background: #ffaa66; color: #2c2c2c; }
        .chest { background: #6c8c5e; color: white; }
        .tax { background: #c95a49; color: white; }
        .jail { background: #b0a790; color: #2c2c2c; }
        .start { background: #d4af37; color: #2c2c2c; }
        .free { background: #e0cba0; color: #5e3a1c; }
        .gotojail { background: #c27e5a; color: white; }

        .cell-name {
            font-weight: bold;
            font-size: 9px;
            line-height: 1.2;
            margin-bottom: 2px;
        }
        .cell-price {
            font-size: 8px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 1px 4px;
            border-radius: 12px;
            margin-top: 2px;
        }
        .owner-marker {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid gold;
        }

        .token {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #ccc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 6px black;
            z-index: 20;
            pointer-events: none;
            border: 1px solid gold;
        }

        .info-panel {
            background: #1e2a2e;
            border-radius: 32px;
            width: 340px;
            padding: 20px 16px;
            color: #f0f0e0;
            box-shadow: 0 12px 28px black;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .players-status {
            background: #2e3b3e;
            border-radius: 24px;
            padding: 12px;
        }

        .player-card {
            background: #3a4a4f;
            margin: 10px 0;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            transition: 0.2s;
            border: 2px solid transparent;
        }

        .player-card.active-turn {
            border: 2px solid gold;
            background: #4e6b5e;
            box-shadow: 0 0 12px gold;
        }

        .token-icon {
            font-size: 28px;
            width: 44px;
            text-align: center;
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-weight: bold;
            font-size: 1rem;
        }

        .player-money {
            font-family: monospace;
            font-size: 1rem;
            font-weight: bold;
            color: #ffd966;
        }

        .dice-area {
            background: #2e3b3e;
            border-radius: 28px;
            padding: 16px;
            text-align: center;
        }

        .dice {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 15px 0;
        }

        .die {
            background: white;
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            box-shadow: inset 0 -2px 0 #aaa, 0 8px 12px black;
            color: #2c2c2c;
        }

        button {
            background: #f4b942;
            border: none;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 10px 20px;
            border-radius: 48px;
            cursor: pointer;
            transition: 0.1s linear;
            font-family: inherit;
            box-shadow: 0 4px 0 #8b5a2b;
            color: #1e2a2e;
            margin-top: 8px;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #8b5a2b;
        }

        button:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .event-log {
            background: #1f2a24;
            border-radius: 24px;
            padding: 12px;
            height: 180px;
            overflow-y: auto;
            font-size: 0.85rem;
            font-family: monospace;
        }

        .event-log p {
            margin: 6px 0;
            border-left: 3px solid #f4b942;
            padding-left: 10px;
        }

        .property-action {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .action-btn {
            background: #3e6b47;
            box-shadow: 0 2px 0 #1f3b2c;
            font-size: 0.9rem;
            padding: 8px 12px;
        }

        h3 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
            text-align: center;
            color: #ffd966;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-wrapper">
        <div class="board">
            <div class="grid" id="monopolyGrid"></div>
        </div>

        <div class="info-panel">
            <div class="players-status" id="playersPanel"></div>
            <div class="dice-area">
                <h3>🎲 БРОСОК 🎲</h3>
                <div class="dice" id="diceContainer">
                    <div class="die">⚀</div>
                    <div class="die">⚀</div>
                </div>
                <button id="rollBtn">Кинуть кубики</button>
                <div class="property-action" id="buySellPanel" style="display: none;">
                    <button id="buyBtn" class="action-btn">🏠 КУПИТЬ</button>
                    <button id="skipBtn" class="action-btn">➡️ ПРОПУСТИТЬ</button>
                </div>
                <button id="endTurnBtn" style="background:#5a626e;">Закончить ход</button>
                <button id="startBtn" style="background:#3e6b47;">СТАРТ ИГРЫ</button>
            </div>
            <div class="event-log" id="eventLog">
                <p>🎲 Подключитесь к серверу и дождитесь начала игры.</p>
            </div>
        </div>
    </div>
</div>

<script>
    let ws = null;
    let playerId = null;
    let gameState = null;
    let cellsData = [];

    // DOM элементы
    const grid = document.getElementById("monopolyGrid");
    const playersPanel = document.getElementById("playersPanel");
    const rollBtn = document.getElementById("rollBtn");
    const endTurnBtn = document.getElementById("endTurnBtn");
    const startBtn = document.getElementById("startBtn");
    const buyPanel = document.getElementById("buySellPanel");
    const buyBtn = document.getElementById("buyBtn");
    const skipBtn = document.getElementById("skipBtn");
    const eventLog = document.getElementById("eventLog");
    const dice1El = document.querySelector("#diceContainer .die:first-child");
    const dice2El = document.querySelector("#diceContainer .die:last-child");

    // Подключение
    function connect() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${window.location.host}`);
        ws.onopen = () => {
            addLog("Соединение установлено. Введите имя:");
            const name = prompt("Введите ваше имя:", "Игрок");
            ws.send(JSON.stringify({ type: "join", name: name || "Игрок" }));
        };
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "joined") {
                playerId = data.playerId;
                addLog("Вы присоединились к игре. Ожидайте старта.");
            } else if (data.type === "log") {
                addLog(data.message);
            } else if (data.type === "error") {
                addLog("Ошибка: " + data.message);
            } else if (data.type === "rollAgain") {
                addLog("Дубль! Вы можете бросить ещё раз.");
                rollBtn.disabled = false;
            } else {
                // Обновление состояния игры
                gameState = data;
                updateUI();
            }
        };
        ws.onclose = () => {
            addLog("Соединение потеряно. Обновите страницу.");
            rollBtn.disabled = true;
            endTurnBtn.disabled = true;
            startBtn.disabled = true;
        };
    }

    function addLog(msg) {
        const p = document.createElement("p");
        p.innerHTML = msg;
        eventLog.appendChild(p);
        p.scrollIntoView({ behavior: "smooth", block: "nearest" });
        if (eventLog.children.length > 20) eventLog.removeChild(eventLog.children[0]);
    }

    function updateUI() {
        if (!gameState) return;

        // Обновляем панель игроков
        playersPanel.innerHTML = "<h3>🏆 Участники 🏆</h3>";
        gameState.players.forEach((p, idx) => {
            const isActive = (gameState.gameStarted && gameState.currentPlayerIndex === idx && !gameState.waitingForBuy);
            const div = document.createElement("div");
            div.className = `player-card ${isActive ? "active-turn" : ""}`;
            div.innerHTML = `
                <div class="token-icon">${p.id === playerId ? "👑" : "🎲"}</div>
                <div class="player-info">
                    <div class="player-name">${p.name} ${p.id === playerId ? "(Вы)" : ""}</div>
                    <div class="player-money">💰 $${p.money}</div>
                    <div style="font-size:12px">🏠 ${p.properties.length} шт.</div>
                </div>
            `;
            playersPanel.appendChild(div);
        });

        // Управление кнопками
        const isMyTurn = gameState.gameStarted && gameState.currentPlayerIndex !== undefined &&
            gameState.players[gameState.currentPlayerIndex] &&
            gameState.players[gameState.currentPlayerIndex].id === playerId;

        if (gameState.gameStarted && !gameState.waitingForBuy && isMyTurn && !gameState.turnInProgress) {
            rollBtn.disabled = false;
            endTurnBtn.disabled = false;
        } else {
            rollBtn.disabled = true;
            endTurnBtn.disabled = true;
        }

        if (gameState.waitingForBuy && isMyTurn) {
            buyPanel.style.display = "flex";
        } else {
            buyPanel.style.display = "none";
        }

        startBtn.disabled = gameState.gameStarted || gameState.players.length < 2 || (gameState.players[0] && gameState.players[0].id !== playerId);

        // Обновление доски
        buildGrid();
        placeTokens();
    }

    // Построение сетки (как в server.js)
    function buildGrid() {
        if (!gameState || !gameState.cells) return;
        const cells = gameState.cells;
        // создаем матрицу 11x11
        const matrix = Array(11).fill().map(() => Array(11).fill(null));
        for (let i = 0; i <= 10; i++) matrix[0][i] = cells[i];
        for (let i = 1; i <= 9; i++) matrix[i][10] = cells[10 + i];
        for (let i = 0; i <= 10; i++) matrix[10][10 - i] = cells[20 + i];
        for (let i = 1; i <= 9; i++) matrix[10 - i][0] = cells[30 + i];

        grid.innerHTML = "";
        for (let row = 0; row < 11; row++) {
            for (let col = 0; col < 11; col++) {
                const cell = matrix[row][col];
                const div = document.createElement("div");
                if (cell) {
                    div.className = `cell ${cell.group === "property" ? cell.color : cell.group}`;
                    div.innerHTML = `
                        <div class="cell-name">${cell.name.substring(0, 12)}</div>
                        ${cell.price > 0 ? `<div class="cell-price">$${cell.price}</div>` : ""}
                        <div class="owner-marker" style="display:${cell.owner !== undefined ? "block" : "none"}; background:${getOwnerColor(cell.owner)};"></div>
                    `;
                    div.dataset.index = cells.indexOf(cell);
                    div.addEventListener("click", () => showPropertyInfo(cell));
                } else {
                    div.className = "cell";
                    div.innerHTML = `<div style="font-size:20px;">🏦</div>`;
                }
                grid.appendChild(div);
            }
        }
    }

    function getOwnerColor(ownerId) {
        if (!gameState) return "gray";
        const owner = gameState.players.find(p => p.id === ownerId);
        return owner ? "#ffd966" : "gray";
    }

    function showPropertyInfo(cell) {
        let info = `${cell.name}\n`;
        if (cell.price > 0) info += `Цена: $${cell.price}\n`;
        if (cell.rent > 0) info += `Аренда: $${cell.rent}\n`;
        if (cell.owner !== undefined) {
            const owner = gameState.players.find(p => p.id === cell.owner);
            info += `Владелец: ${owner ? owner.name : "никто"}`;
        } else info += "Свободно";
        alert(info);
    }

    function placeTokens() {
        if (!gameState) return;
        const oldTokens = document.querySelectorAll(".token");
        oldTokens.forEach(t => t.remove());

        gameState.players.forEach((player, idx) => {
            const pos = player.position;
            const cellsDivs = document.querySelectorAll(".cell");
            let targetDiv = null;
            for (let div of cellsDivs) {
                if (div.dataset.index && parseInt(div.dataset.index) === pos) {
                    targetDiv = div;
                    break;
                }
            }
            if (targetDiv) {
                const rect = targetDiv.getBoundingClientRect();
                const gridRect = grid.getBoundingClientRect();
                const token = document.createElement("div");
                token.className = "token";
                token.style.left = (rect.left - gridRect.left + rect.width/2 - 16) + "px";
                token.style.top = (rect.top - gridRect.top + rect.height/2 - 16) + "px";
                token.style.backgroundColor = idx === 0 ? "#FFD966" : (idx === 1 ? "#6aa9ff" : (idx === 2 ? "#ff8c66" : "#77dd77"));
                token.innerHTML = player.id === playerId ? "👑" : "🎲";
                token.style.color = "#111";
                grid.style.position = "relative";
                grid.appendChild(token);
            }
        });
    }

    function rollDice() {
        if (ws && gameState && gameState.gameStarted && !gameState.waitingForBuy) {
            ws.send(JSON.stringify({ type: "roll" }));
        }
    }

    function endTurn() {
        if (ws && gameState && gameState.gameStarted && !gameState.waitingForBuy) {
            ws.send(JSON.stringify({ type: "endTurn" }));
        }
    }

    function startGame() {
        if (ws && !gameState.gameStarted) {
            ws.send(JSON.stringify({ type: "start" }));
        }
    }

    function buyProperty() {
        if (ws && gameState.waitingForBuy) {
            ws.send(JSON.stringify({ type: "buy" }));
        }
    }

    function skipBuy() {
        if (ws && gameState.waitingForBuy) {
            ws.send(JSON.stringify({ type: "skip" }));
        }
    }

    // Слушатели
    rollBtn.addEventListener("click", rollDice);
    endTurnBtn.addEventListener("click", endTurn);
    startBtn.addEventListener("click", startGame);
    buyBtn.addEventListener("click", buyProperty);
    skipBtn.addEventListener("click", skipBuy);

    connect();
</script>
</body>
</html>
