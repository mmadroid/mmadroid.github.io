<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Wallet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            transition: background-color 0.2s, color 0.2s;
        }

        #app {
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 16px;
            padding: 16px;
        }

        .balance {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            flex: 1 0 auto;
            min-width: 120px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            font-size: 16px;
        }

        @media (max-width: 480px) {
            #app {
                padding: 12px;
            }
            .balance {
                font-size: 1.5rem;
            }
            button {
                padding: 10px 16px;
                min-width: 100px;
            }
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <div class="card">
            <div class="balance" id="balance">0.00 ETH</div>
            <div style="text-align: center; margin-top: 8px;">Address: <span id="address">Not connected</span></div>
        </div>
        <div class="button-group">
            <button id="create-wallet">Create Wallet</button>
            <button id="import-wallet">Import Wallet</button>
        </div>
        <div id="send-section" class="card" style="display: none;">
            <input type="text" id="to-address" placeholder="Recipient address">
            <input type="text" id="amount" placeholder="Amount in ETH">
            <button id="send-btn" style="margin-top: 12px;">Send</button>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Адаптивная высота
        const app = document.getElementById('app');
        function setHeight() {
            // Можно не трогать, если используем flex и padding, но для полного контроля:
            document.body.style.height = `${tg.viewportHeight}px`;
        }
        setHeight();
        tg.onEvent('viewportChanged', setHeight);

        // Тема
        const theme = tg.themeParams;
        if (theme) {
            document.documentElement.style.setProperty('--tg-theme-bg-color', theme.bg_color || '#ffffff');
            document.documentElement.style.setProperty('--tg-theme-text-color', theme.text_color || '#000000');
            document.documentElement.style.setProperty('--tg-theme-button-color', theme.button_color || '#2481cc');
            document.documentElement.style.setProperty('--tg-theme-button-text-color', theme.button_text_color || '#ffffff');
            document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', theme.secondary_bg_color || '#f5f5f5');
            document.documentElement.style.setProperty('--tg-theme-hint-color', theme.hint_color || '#cccccc');
        }
    </script>
</body>
</html>
