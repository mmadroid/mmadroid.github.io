<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Монополия — Классическая настольная игра</title>
    <style>
        * {
            user-select: none;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b2b1f 0%, #1e3b2a 100%);
            font-family: 'Segoe UI', 'Poppins', 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }

        /* главный контейнер */
        .game-container {
            background: #2b2b2b;
            border-radius: 48px;
            box-shadow: 0 30px 40px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.1);
            padding: 20px;
        }

        .game-wrapper {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        /* игровое поле (CSS Grid) */
        .board {
            background: #f7e9cd;
            border-radius: 28px;
            padding: 12px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(11, 70px);
            grid-template-rows: repeat(11, 70px);
            background-color: #e0cba0;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        /* общий стиль клеток */
        .cell {
            background-color: #f3e5c0;
            border: 1px solid #b57a3b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            position: relative;
            transition: 0.1s linear;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(255,255,200,0.3);
        }

        .cell:hover {
            filter: brightness(0.95);
            transform: scale(0.98);
        }

        /* цвета групп (по классике) */
        .brown { background: #b97f5c; color: white; text-shadow: 0 0 2px black; }
        .lightblue { background: #9fd9ff; color: #1e2a2e; }
        .pink { background: #f5a9b8; color: #2c2c2c; }
        .orange { background: #ffb347; color: #2c2c2c; }
        .red { background: #e55a4f; color: white; }
        .yellow { background: #ffd966; color: #2c2c2c; }
        .green { background: #6fbf4c; color: white; }
        .darkblue { background: #2a6f8f; color: white; }
        .station { background: #5a5a5a; color: white; background-image: radial-gradient(circle at 10px 10px, #888 1.5px, transparent 1px); background-size: 12px 12px; }
        .utility { background: #c0c0c0; color: #111; }
        .chance { background: #ffaa66; color: #2c2c2c; font-weight: bold; background-image: repeating-linear-gradient(45deg, #ffcc88 0px, #ffcc88 2px, #ffaa66 2px, #ffaa66 6px); }
        .chest { background: #6c8c5e; color: white; background-image: radial-gradient(circle at 70% 30%, #aacc88 2px, transparent 2px); background-size: 12px 12px; }
        .tax { background: #c95a49; color: white; }
        .jail { background: #b0a790; color: #2c2c2c; }
        .start { background: #d4af37; color: #2c2c2c; font-weight: bold; }
        .free { background: #e0cba0; color: #5e3a1c; }
        .gotojail { background: #c27e5a; color: white; }

        .cell-name {
            font-weight: bold;
            font-size: 9px;
            max-width: 90%;
            line-height: 1.2;
            margin-bottom: 2px;
        }
        .cell-price {
            font-size: 8px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 1px 4px;
            border-radius: 12px;
            margin-top: 2px;
        }
        .owner-marker {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid gold;
        }

        /* фишки игроков (абсолютное позиционирование поверх сетки) */
        .token {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #ccc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 2px 6px black;
            transition: all 0.2s ease;
            z-index: 20;
            pointer-events: none;
            border: 1px solid gold;
        }

        /* панель справа */
        .info-panel {
            background: #1e2a2e;
            border-radius: 32px;
            width: 340px;
            padding: 20px 16px;
            color: #f0f0e0;
            box-shadow: 0 12px 28px black;
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .players-status {
            background: #2e3b3e;
            border-radius: 24px;
            padding: 12px;
        }

        .player-card {
            background: #3a4a4f;
            margin: 10px 0;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            transition: 0.2s;
            border: 2px solid transparent;
        }

        .player-card.active-turn {
            border: 2px solid gold;
            background: #4e6b5e;
            box-shadow: 0 0 12px gold;
        }

        .token-icon {
            font-size: 32px;
            width: 48px;
            text-align: center;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .player-money {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffd966;
        }

        .dice-area {
            background: #2e3b3e;
            border-radius: 28px;
            padding: 16px;
            text-align: center;
        }

        .dice {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 15px 0;
        }

        .die {
            background: white;
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            box-shadow: inset 0 -2px 0 #aaa, 0 8px 12px black;
            color: #2c2c2c;
        }

        button {
            background: #f4b942;
            border: none;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 12px 24px;
            border-radius: 48px;
            cursor: pointer;
            transition: 0.1s linear;
            font-family: inherit;
            box-shadow: 0 4px 0 #8b5a2b;
            color: #1e2a2e;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #8b5a2b;
        }

        button:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .event-log {
            background: #1f2a24;
            border-radius: 24px;
            padding: 12px;
            height: 180px;
            overflow-y: auto;
            font-size: 0.85rem;
            font-family: monospace;
        }

        .event-log p {
            margin: 6px 0;
            border-left: 3px solid #f4b942;
            padding-left: 10px;
        }

        .property-action {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .action-btn {
            background: #3e6b47;
            box-shadow: 0 2px 0 #1f3b2c;
            font-size: 0.9rem;
            padding: 8px 12px;
        }

        h3 {
            margin: 0 0 8px 0;
            font-size: 1.3rem;
            text-align: center;
            color: #ffd966;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-wrapper">
        <!-- Игровое поле (сетка 11x11) -->
        <div class="board">
            <div class="grid" id="monopolyGrid"></div>
        </div>

        <!-- Панель управления -->
        <div class="info-panel">
            <div class="players-status" id="playersPanel"></div>
            <div class="dice-area">
                <h3>🎲 БРОСОК 🎲</h3>
                <div class="dice" id="diceContainer">
                    <div class="die">⚀</div>
                    <div class="die">⚀</div>
                </div>
                <button id="rollBtn">Кинуть кубики</button>
                <div class="property-action" id="buySellPanel" style="display: none;">
                    <button id="buyBtn" class="action-btn">🏠 КУПИТЬ</button>
                    <button id="skipBtn" class="action-btn">➡️ ПРОПУСТИТЬ</button>
                </div>
                <button id="endTurnBtn" style="margin-top: 12px; background:#5a626e;" disabled>Закончить ход</button>
            </div>
            <div class="event-log" id="eventLog">
                <p>🎲 Добро пожаловать в Монополию!</p>
                <p>👑 Вы — жёлтая фишка. Бросайте кубики, покупайте собственность!</p>
            </div>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------

    // --------------------------------------------------------------

        { name: "ВИРДЖИНИЯ-АВЕНЮ", colorGroup: "pink", price: 140, rent: 10, group: "property", position: 12 },
        { name: "ШАНС", colorGroup: "chance", price: 0, rent: 0, group: "chance", position: 13 },

        { name: "ОБЩЕСТВЕННАЯ КАЗНА", colorGroup: "chest", price: 0, rent: 0, group: "chest", position: 17 },
        { name: "АВЕНЮ КЕНТУККИ", colorGroup: "red", price: 220, rent: 18, group: "property", position: 18 },
        { name: "ШАНС", colorGroup: "chance", price: 0, rent: 0, group: "chance", position: 19 },
        { name: "ИНДИАНА-АВЕНЮ", colorGroup: "red", price: 220, rent: 18, group: "property", position: 20 },
        { name: "ЖЕЛЕЗНАЯ ДОРОГА", colorGroup: "station", price: 200, rent: 25, group: "station", position: 21 },
        { name: "АВЕНЮ ИЛЛИНОЙС", colorGroup: "yellow", price: 260, rent: 22, group: "property", position: 22 },
        { name: "ШАНС", colorGroup: "chance", price: 0, rent: 0, group: "chance", position: 23 },
        { name: "АВЕНЮ ИНДИАНА", colorGroup: "yellow", price: 260, rent: 22, group: "property", position: 24 },
        { name: "ВОДОПРОВОД", colorGroup: "utility", price: 150, rent: 0, group: "utility", position: 25 },
        { name: "АВЕНЮ АТЛАНТИК", colorGroup: "green", price: 300, rent: 26, group: "property", position: 26 },
        { name: "АВЕНЮ ВЕНТНОР", colorGroup: "green", price: 300, rent: 26, group: "property", position: 27 },
        { name: "ОБЩЕСТВЕННАЯ КАЗНА", colorGroup: "chest", price: 0, rent: 0, group: "chest", position: 28 },
        { name: "АВЕНЮ МАРВИН-ГАРДЕНС", colorGroup: "green", price: 320, rent: 28, group: "property", position: 29 },
        { name: "ИДИТЕ В ТЮРЬМУ", colorGroup: "gotojail", price: 0, rent: 0, group: "gotojail", position: 30 },
        { name: "АВЕНЮ ПАСИФИК", colorGroup: "darkblue", price: 400, rent: 50, group: "property", position: 31 },
        { name: "АВЕНЮ НОРТ-КАРОЛИНА", colorGroup: "darkblue", price: 400, rent: 50, group: "property", position: 32 },
        { name: "ОБЩЕСТВЕННАЯ КАЗНА", colorGroup: "chest", price: 0, rent: 0, group: "chest", position: 33 },
        { name: "АВЕНЮ ПЕНСИЛЬВАНИЯ", colorGroup: "darkblue", price: 420, rent: 55, group: "property", position: 34 },
        { name: "ШАНС", colorGroup: "chance", price: 0, rent: 0, group: "chance", position: 35 },
        { name: "ЖЕЛЕЗНАЯ ДОРОГА (SHORT)", colorGroup: "station", price: 200, rent: 25, group: "station", position: 36 },
        { name: "НАЛОГ НА РОСКОШЬ", colorGroup: "tax", price: 100, rent: 0, group: "tax", position: 37 },
        { name: "АВЕНЮ ПАРК-ПЛЕЙС", colorGroup: "darkblue", price: 350, rent: 35, group: "property", position: 38 },
        { name: "ШАНС", colorGroup: "chance", price: 0, rent: 0, group: "chance", position: 39 }
    ];

    // Карточки шанс и общественная казна
    const CHANCE_CARDS = [
        { text: "Банк выплачивает дивиденды: +150$", money: 150, moveTo: null },
        { text: "Идите на СТАРТ, получите 200$", money: 200, moveTo: 0 },
        { text: "Штраф за превышение скорости: -50$", money: -50, moveTo: null },
        { text: "Продвиньтесь до Иллинойс-Авеню (22)", money: 0, moveTo: 22 },
        { text: "Ваш залог возвращён: +100$", money: 100, moveTo: null },
        { text: "Заплатите за ремонт улиц: -40$", money: -40, moveTo: null }
    ];
    const CHEST_CARDS = [
        { text: "Ошибка банка: +200$", money: 200, moveTo: null },
        { text: "Лечение: -100$", money: -100, moveTo: null },
        { text: "Выигрыш в конкурсе: +50$", money: 50, moveTo: null },
        { text: "Идите на СТАРТ (+200$)", money: 200, moveTo: 0 },
        { text: "Налоговая скидка: +75$", money: 75, moveTo: null }
    ];
    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }
    shuffle(CHANCE_CARDS);
    shuffle(CHEST_CARDS);
    let chanceIdx = 0, chestIdx = 0;

    // Игроки
    const players = [
        { id: 0, name: "🧑‍💼 Вы", money: 1500, position: 0, properties: [], type: "human", token: "👑", color: "#FFD966", tokenSymbol: "⭐" },
        { id: 1, name: "🤖 Комп A", money: 1500, position: 0, properties: [], type: "bot", token: "🤖", color: "#6aa9ff", tokenSymbol: "⚙️" },
        { id: 2, name: "🤖 Комп B", money: 1500, position: 0, properties: [], type: "bot", token: "⚙️", color: "#ff8c66", tokenSymbol: "🔧" },
        { id: 3, name: "🤖 Комп C", money: 1500, position: 0, properties: [], type: "bot", token: "📀", color: "#77dd77", tokenSymbol: "📌" }
    ];
    let currentPlayerIdx = 0;
    let waitingForBuy = false;
    let currentPropertyIndex = -1;
    let rollValue = 0;
    let gameActive = true;

    // Вспомогательные функции
    function addLog(msg) {
        const logDiv = document.getElementById("eventLog");
        const p = document.createElement("p");
        p.innerHTML = msg;
        logDiv.appendChild(p);
        p.scrollIntoView({ behavior: "smooth", block: "nearest" });
        if (logDiv.children.length > 15) logDiv.removeChild(logDiv.children[0]);
    }

    function updateMoneyDisplay() {
        const panel = document.getElementById("playersPanel");
        panel.innerHTML = "<h3>🏆 Участники 🏆</h3>";
        players.forEach((p, idx) => {
            const activeClass = (currentPlayerIdx === idx && gameActive && !waitingForBuy) ? "active-turn" : "";
            const div = document.createElement("div");
            div.className = `player-card ${activeClass}`;
            div.innerHTML = `
                <div class="token-icon">${p.tokenSymbol}</div>
                <div class="player-info">
                    <div class="player-name">${p.name}</div>
                    <div class="player-money">💰 $${p.money}</div>
                    <div style="font-size:12px">🏠 ${p.properties.length} шт.</div>
                </div>
            `;
            panel.appendChild(div);
        });
    }

    // Построение сетки 11x11 (классическое расположение клеток по периметру)
    function buildGrid() {
        const grid = document.getElementById("monopolyGrid");
        grid.innerHTML = "";
        // создаём массив 11x11
        const matrix = Array(11).fill().map(() => Array(11).fill(null));
        // заполняем углы и периметр согласно порядку клеток
        // верхний ряд (0..10)
        for (let i = 0; i <= 10; i++) matrix[0][i] = CELLS_DATA[i];
        // правый столбец (1..9)
        for (let i = 1; i <= 9; i++) matrix[i][10] = CELLS_DATA[10 + i];
        // нижний ряд (10..0)
        for (let i = 0; i <= 10; i++) matrix[10][10 - i] = CELLS_DATA[20 + i];
        // левый столбец (9..1)
        for (let i = 1; i <= 9; i++) matrix[10 - i][0] = CELLS_DATA[30 + i];

        // центральная область пустая (оставим декорацию)
        for (let i = 1; i <= 9; i++) {
            for (let j = 1; j <= 9; j++) {
                matrix[i][j] = { name: "", colorGroup: "center", price: 0, group: "center", position: -1 };
            }
        }

        // отрисовка
        for (let row = 0; row < 11; row++) {
            for (let col = 0; col < 11; col++) {
                const cell = matrix[row][col];
                if (!cell) continue;
                const div = document.createElement("div");
                div.className = `cell ${cell.colorGroup}`;
                if (cell.name) {
                    div.innerHTML = `
                        <div class="cell-name">${cell.name.substring(0, 12)}</div>
                        ${cell.price > 0 ? `<div class="cell-price">$${cell.price}</div>` : ""}
                        <div class="owner-marker" style="display:none;"></div>
                    `;
                    div.dataset.position = cell.position;
                    div.addEventListener("click", () => showPropertyInfo(cell.position));
                } else {
                    div.innerHTML = `<div style="font-size:20px;">🏦</div>`;
                }
                grid.appendChild(div);
            }
        }
        updateOwnersMarkers();
    }

    function updateOwnersMarkers() {
        // обновляем маркеры владельцев в клетках
        const cellsDivs = document.querySelectorAll(".cell");
        cellsDivs.forEach(div => {
            const pos = parseInt(div.dataset.position);
            if (isNaN(pos)) return;
            const cellData = CELLS_DATA[pos];
            const marker = div.querySelector(".owner-marker");
            if (cellData.owner !== undefined && cellData.owner !== null) {
                const owner = players.find(p => p.id === cellData.owner);
                if (owner) {
                    marker.style.display = "block";
                    marker.style.backgroundColor = owner.color;
                    marker.title = `Владелец: ${owner.name}`;
                } else marker.style.display = "none";
            } else marker.style.display = "none";
        });
    }

    function showPropertyInfo(pos) {
        const cell = CELLS_DATA[pos];
        if (!cell) return;
        let info = `${cell.name}\n`;
        if (cell.price > 0) info += `Цена: $${cell.price}\n`;
        if (cell.rent > 0) info += `Аренда: $${cell.rent}\n`;
        if (cell.owner !== undefined) {
            const owner = players.find(p => p.id === cell.owner);
            info += `Владелец: ${owner ? owner.name : "никто"}`;
        } else info += "Свободно";
        alert(info);
    }

    // позиционирование фишек поверх сетки
    function placeTokens() {
        const grid = document.getElementById("monopolyGrid");
        const cells = grid.children;
        // удаляем старые токены
        document.querySelectorAll(".token").forEach(t => t.remove());
        players.forEach(player => {
            const pos = player.position;
            const targetDiv = Array.from(cells).find(div => parseInt(div.dataset.position) === pos);
            if (targetDiv) {
                const rect = targetDiv.getBoundingClientRect();
                const gridRect = grid.getBoundingClientRect();
                const token = document.createElement("div");
                token.className = "token";
                token.style.left = (rect.left - gridRect.left + rect.width/2 - 16) + "px";
                token.style.top = (rect.top - gridRect.top + rect.height/2 - 16) + "px";
                token.style.backgroundColor = player.color;
                token.innerHTML = player.tokenSymbol;
                token.style.color = "#111";
                grid.style.position = "relative";
                grid.appendChild(token);
            }
        });
    }

    // Игровая логика (ходы, покупки и т.д.)
    function handleLandOnProperty(player, prop) {
        if (prop.group === "start") return;
        if (prop.group === "tax") {
            player.money -= prop.price;
            addLog(`💸 Налог ${prop.name}: ${player.name} заплатил $${prop.price}`);
            updateMoneyDisplay();
            return;
        }
        if (prop.group === "chance") {
            drawCard(CHANCE_CARDS, player, "🎲 ШАНС");
            return;
        }
        if (prop.group === "chest") {
            drawCard(CHEST_CARDS, player, "📦 ОБЩЕСТВЕННАЯ КАЗНА");
            return;
        }
        if (prop.group === "gotojail") {
            player.position = 9;
            addLog(`🚔 ${player.name} отправляется в тюрьму!`);
            placeTokens();
            endTurnAfterAction();
            return;
        }
        if (prop.group === "property" || prop.group === "station" || prop.group === "utility") {
            if (prop.owner !== undefined && prop.owner !== player.id) {
                const owner = players.find(p => p.id === prop.owner);
                if (owner) {
                    let rent = prop.rent;
                    if (prop.group === "utility") {
                        let ownedUtils = owner.properties.filter(p => p.group === "utility").length;
                        rent = (ownedUtils === 2) ? rollValue * 10 : rollValue * 4;
                    }
                    if (prop.group === "station") {
                        let stations = owner.properties.filter(p => p.group === "station").length;
                        rent = [25, 50, 100, 200][stations-1] || 25;
                    }
                    player.money -= rent;
                    owner.money += rent;
                    addLog(`🏠 Аренда: ${player.name} заплатил ${owner.name} $${rent} за ${prop.name}`);
                    updateMoneyDisplay();
                }
            } else if (prop.owner === undefined && prop.price > 0 && player.money >= prop.price && player.type === "human" && !waitingForBuy) {
                waitingForBuy = true;
                currentPropertyIndex = prop.position;
                document.getElementById("buySellPanel").style.display = "flex";
                addLog(`💰 ${player.name}, хотите купить ${prop.name} за $${prop.price}?`);
                refreshUI();
                return;
            } else if (prop.owner === undefined && player.type === "bot" && player.money >= prop.price && Math.random() < 0.65) {
                player.money -= prop.price;
                prop.owner = player.id;
                player.properties.push(prop);
                addLog(`🤖 ${player.name} купил ${prop.name} за $${prop.price}`);
                updateMoneyDisplay();
                updateOwnersMarkers();
            }
        }
        afterMoveAction();
    }

    function drawCard(deck, player, title) {
        let card = deck[Math.floor(Math.random() * deck.length)];
        addLog(`${title}: ${card.text}`);
        if (card.money !== 0) {
            player.money += card.money;
            addLog(`💰 ${player.name} ${card.money>0 ? "получил" : "потерял"} ${Math.abs(card.money)}$`);
            updateMoneyDisplay();
        }
        if (card.moveTo !== null && card.moveTo !== undefined) {
            player.position = card.moveTo;
            addLog(`🚀 ${player.name} перемещается на ${CELLS_DATA[card.moveTo].name}`);
            placeTokens();
        }
        afterMoveAction();
    }

    function afterMoveAction() {
        if (!gameActive) return;
        if (players[currentPlayerIdx].money <= 0) bankrupt();
        else endTurnAfterAction();
    }

    function endTurnAfterAction() {
        if (waitingForBuy) return;
        nextTurn();
    }

    function nextTurn() {
        currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
        waitingForBuy = false;
        document.getElementById("buySellPanel").style.display = "none";
        refreshUI();
        addLog(`✨ Ход переходит к ${players[currentPlayerIdx].name}`);
        if (!gameActive) return;
        if (players[currentPlayerIdx].type === "bot") setTimeout(() => botTurn(), 600);
    }

    function bankrupt() {
        let player = players[currentPlayerIdx];
        addLog(`💀 ${player.name} обанкротился! Исключён из игры.`);
        players.splice(currentPlayerIdx, 1);
        if (players.length === 1) {
            gameActive = false;
            addLog(`🏆 ИГРА ОКОНЧЕНА! Победитель: ${players[0].name} 🏆`);
            document.getElementById("rollBtn").disabled = true;
            document.getElementById("endTurnBtn").disabled = true;
            return;
        }
        if (currentPlayerIdx >= players.length) currentPlayerIdx = 0;
        refreshUI();
        if (players[currentPlayerIdx].type === "bot") setTimeout(() => botTurn(), 500);
    }

    async function performMove() {
        if (!gameActive) return;
        const player = players[currentPlayerIdx];
        const dice1 = Math.floor(Math.random() * 6) + 1;
        const dice2 = Math.floor(Math.random() * 6) + 1;
        rollValue = dice1 + dice2;
        const dieEls = document.querySelectorAll(".die");
        const diceMap = {1:"⚀",2:"⚁",3:"⚂",4:"⚃",5:"⚄",6:"⚅"};
        dieEls[0].innerText = diceMap[dice1];
        dieEls[1].innerText = diceMap[dice2];
        addLog(`🎲 ${player.name} выбросил ${dice1} и ${dice2} (сумма ${rollValue})`);
        let newPos = player.position + rollValue;
        if (newPos >= 40) {
            newPos -= 40;
            player.money += 200;
            addLog(`💰 Проход СТАРТА: ${player.name} получает 200$`);
            updateMoneyDisplay();
        }
        player.position = newPos;
        placeTokens();
        const landed = CELLS_DATA[player.position];
        addLog(`📍 ${player.name} на клетке: ${landed.name}`);
        await new Promise(resolve => {
            const callback = () => {
                if (waitingForBuy) return;
                resolve();
            };
            handleLandOnProperty(player, landed);
            setTimeout(() => { if(!waitingForBuy) resolve(); }, 200);
        });
        if (!gameActive) return;
        if (players[currentPlayerIdx] && players[currentPlayerIdx].money <= 0) { bankrupt(); return; }
        if (dice1 === dice2 && !waitingForBuy) {
            addLog(`🎲 ДУБЛЬ! ${player.name} ходит ещё раз.`);
            setTimeout(() => performMove(), 1200);
        } else {
            if (!waitingForBuy) nextTurn();
        }
    }

    function botTurn() {
        if (!gameActive) return;
        if (players[currentPlayerIdx].type === "bot" && !waitingForBuy) performMove();
        else refreshUI();
    }

    function humanRoll() {
        if (!gameActive) return;
        const p = players[currentPlayerIdx];
        if (p.type !== "human" || waitingForBuy) return;
        performMove();
    }

    function buyProperty() {
        if (!waitingForBuy) return;
        const prop = CELLS_DATA[currentPropertyIndex];
        const player = players[currentPlayerIdx];
        if (player.money >= prop.price && prop.owner === undefined) {
            player.money -= prop.price;
            prop.owner = player.id;
            player.properties.push(prop);
            addLog(`🏘️ ${player.name} купил ${prop.name} за $${prop.price}`);
            updateMoneyDisplay();
            updateOwnersMarkers();
        } else {
            addLog(`❌ Недостаточно средств или уже куплено`);
        }
        waitingForBuy = false;
        document.getElementById("buySellPanel").style.display = "none";
        afterMoveAction();
    }

    function skipBuy() {
        waitingForBuy = false;
        document.getElementById("buySellPanel").style.display = "none";
        addLog(`🚫 ${players[currentPlayerIdx].name} отказался покупать.`);
        afterMoveAction();
    }

    function refreshUI() {
        updateMoneyDisplay();
        placeTokens();
        updateOwnersMarkers();
        const rollBtn = document.getElementById("rollBtn");
        const endBtn = document.getElementById("endTurnBtn");
        if (!gameActive) {
            rollBtn.disabled = true;
            endBtn.disabled = true;
            return;
        }
        const current = players[currentPlayerIdx];
        if (current.type === "human" && !waitingForBuy) {
            rollBtn.disabled = false;
            endBtn.disabled = true;
        } else {
            rollBtn.disabled = true;
            endBtn.disabled = true;
        }
    }

    // Инициализация
    function initGame() {
        for (let cell of CELLS_DATA) cell.owner = undefined;
        players.forEach(p => { p.money = 1500; p.position = 0; p.properties = []; });
        currentPlayerIdx = 0;
        waitingForBuy = false;
        gameActive = true;
        buildGrid();
        placeTokens();
        refreshUI();
        addLog("🎲 Игра началась! Ваш ход (желтая фишка).");
        if (players[0].type !== "human") setTimeout(() => botTurn(), 500);
    }

    document.getElementById("rollBtn").addEventListener("click", humanRoll);
    document.getElementById("endTurnBtn").addEventListener("click", () => { if(!waitingForBuy) nextTurn(); });
    document.getElementById("buyBtn").addEventListener("click", buyProperty);
    document.getElementById("skipBtn").addEventListener("click", skipBuy);

    initGame();
</script>
</body>
</html>
