<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NFT Монополия</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 16px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .cell {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 8px;
            padding: 12px 4px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .cell.owned {
            background: #4caf50;
            color: white;
        }
        .cell.player {
            box-shadow: 0 0 0 2px var(--tg-theme-button-color);
            font-weight: bold;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        button {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .info {
            background: var(--tg-theme-secondary-bg-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .nft-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .nft-item {
            background: var(--tg-theme-bg-color);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            width: 80px;
        }
        .nft-item img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .reset-btn {
            background: #f44336;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="board" class="board"></div>
    <div class="controls">
        <button id="rollBtn">🎲 Бросить кубик</button>
        <button id="resetBtn" class="reset-btn">🔄 Сбросить игру</button>
    </div>
    <div class="info">
        <div>💰 Баланс: <span id="balance">0</span> монет</div>
        <div>🏆 Позиция: <span id="positionName"></span></div>
    </div>
    <div class="info">
        <div>🏠 Ваша недвижимость:</div>
        <div id="ownedCells"></div>
    </div>
    <div class="info">
        <div>🎁 NFT-подарки:</div>
        <div id="nftInventory" class="nft-list"></div>
    </div>

    <script>
        // --- Данные игры ---
        const cells = [
            { name: "Старт", price: 0, rent: 0, nft: null },
            { name: "Арбат", price: 300, rent: 50, nft: "arbat" },
            { name: "Тверская", price: 350, rent: 60, nft: "tverskaya" },
            { name: "Шанс", price: 0, rent: 0, nft: null },
            { name: "Новослободская", price: 400, rent: 70, nft: "novoslob" },
            { name: "Садовое кольцо", price: 450, rent: 80, nft: "sadovoe" },
            { name: "Тюрьма", price: 0, rent: 0, nft: null },
            { name: "Кутузовский", price: 500, rent: 100, nft: "kutuzov" },
            { name: "Ленинский", price: 550, rent: 110, nft: "leninsky" },
            { name: "Шанс", price: 0, rent: 0, nft: null },
            { name: "Москва-Сити", price: 600, rent: 120, nft: "city" },
            { name: "Финиш", price: 0, rent: 0, nft: null }
        ];

        // Ссылки на изображения NFT (замените на реальные URL)
        const nftImages = {
            arbat: "https://placehold.co/60x60/FFD700/000?text=Arbat",
            tverskaya: "https://placehold.co/60x60/FFD700/000?text=Tverskaya",
            novoslob: "https://placehold.co/60x60/FFD700/000?text=Novoslob",
            sadovoe: "https://placehold.co/60x60/FFD700/000?text=Sadovoe",
            kutuzov: "https://placehold.co/60x60/FFD700/000?text=Kutuzov",
            leninsky: "https://placehold.co/60x60/FFD700/000?text=Leninsky",
            city: "https://placehold.co/60x60/FFD700/000?text=City"
        };

        // --- Состояние игры ---
        let gameState = {
            balance: 1500,
            position: 0,
            ownedCells: [],      // индексы клеток, принадлежащих игроку
            nfts: []             // массив идентификаторов полученных NFT
        };

        // --- Загрузка/сохранение в localStorage ---
        function loadGame() {
            const saved = localStorage.getItem('monopoly_nft');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameState = { ...gameState, ...parsed };
                } catch(e) {}
            }
        }

        function saveGame() {
            localStorage.setItem('monopoly_nft', JSON.stringify(gameState));
        }

        // --- Отрисовка поля ---
        function renderBoard() {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';
            cells.forEach((cell, idx) => {
                const cellDiv = document.createElement('div');
                cellDiv.className = 'cell';
                if (gameState.ownedCells.includes(idx)) cellDiv.classList.add('owned');
                if (idx === gameState.position) cellDiv.classList.add('player');
                cellDiv.innerHTML = `<b>${cell.name}</b><br>${cell.price > 0 ? cell.price + '💰' : ''}`;
                if (cell.price > 0 && !gameState.ownedCells.includes(idx)) {
                    cellDiv.style.cursor = 'pointer';
                    cellDiv.onclick = () => buyCell(idx);
                } else {
                    cellDiv.onclick = null;
                }
                boardDiv.appendChild(cellDiv);
            });
            document.getElementById('balance').innerText = gameState.balance;
            document.getElementById('positionName').innerText = cells[gameState.position].name;
            renderOwned();
            renderNFTs();
        }

        function renderOwned() {
            const ownedDiv = document.getElementById('ownedCells');
            if (gameState.ownedCells.length === 0) {
                ownedDiv.innerText = 'Нет недвижимости';
                return;
            }
            ownedDiv.innerHTML = gameState.ownedCells.map(idx => cells[idx].name).join(', ');
        }

        function renderNFTs() {
            const nftDiv = document.getElementById('nftInventory');
            if (gameState.nfts.length === 0) {
                nftDiv.innerHTML = '<div>У вас пока нет NFT-подарков</div>';
                return;
            }
            nftDiv.innerHTML = gameState.nfts.map(nftId => `
                <div class="nft-item">
                    <img src="${nftImages[nftId]}" alt="${nftId}">
                    <div>${cells.find(c => c.nft === nftId)?.name || nftId}</div>
                </div>
            `).join('');
        }

        // --- Покупка клетки ---
        function buyCell(idx) {
            const cell = cells[idx];
            if (gameState.ownedCells.includes(idx)) {
                alert("Эта улица уже ваша!");
                return;
            }
            if (gameState.balance < cell.price) {
                alert("Недостаточно денег!");
                return;
            }
            gameState.balance -= cell.price;
            gameState.ownedCells.push(idx);
            // Если у клетки есть NFT, добавляем его в инвентарь
            if (cell.nft && !gameState.nfts.includes(cell.nft)) {
                gameState.nfts.push(cell.nft);
                // Отправляем событие в Telegram (опционально)
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.sendData(JSON.stringify({
                        action: 'nft_received',
                        nft: cell.nft,
                        cell: cell.name
                    }));
                }
                alert(`🎉 Поздравляем! Вы получили NFT-подарок "${cell.name}"!`);
            }
            saveGame();
            renderBoard();
        }

        // --- Бросок кубика ---
        function rollDice() {
            const dice = Math.floor(Math.random() * 6) + 1;
            let newPos = (gameState.position + dice) % cells.length;
            // Если проходим Старт, начисляем 200
            if (newPos < gameState.position) {
                gameState.balance += 200;
            }
            gameState.position = newPos;

            // Обработка клетки
            const currentCell = cells[gameState.position];
            if (currentCell.price > 0 && gameState.ownedCells.includes(gameState.position)) {
                // Если клетка принадлежит игроку, ничего не делаем
            } else if (currentCell.price > 0 && !gameState.ownedCells.includes(gameState.position)) {
                // Можно предложить купить (игрок купит позже по клику)
                alert(`Вы попали на ${currentCell.name}. Можете купить её за ${currentCell.price}💰.`);
            } else if (currentCell.name === "Шанс") {
                // Случайное событие
                const chance = Math.random();
                if (chance < 0.3) {
                    const bonus = 100;
                    gameState.balance += bonus;
                    alert(`Шанс! Вы получили ${bonus}💰`);
                } else if (chance < 0.6) {
                    const penalty = 50;
                    gameState.balance -= penalty;
                    alert(`Шанс! Вы заплатили штраф ${penalty}💰`);
                } else {
                    alert(`Шанс! Вам повезло, ничего не произошло`);
                }
            } else if (currentCell.name === "Тюрьма") {
                alert("Вы в тюрьме! Пропускаете ход.");
                // В упрощённой версии просто пропускаем ход (ничего не делаем)
            }

            saveGame();
            renderBoard();

            // Отправляем данные боту
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(JSON.stringify({
                    action: 'move',
                    dice: dice,
                    newPos: newPos,
                    balance: gameState.balance
                }));
            }
        }

        // --- Сброс игры ---
        function resetGame() {
            if (confirm("Сбросить весь прогресс? Все купленные улицы и NFT будут потеряны.")) {
                gameState = {
                    balance: 1500,
                    position: 0,
                    ownedCells: [],
                    nfts: []
                };
                saveGame();
                renderBoard();
                alert("Игра сброшена!");
            }
        }

        // --- Инициализация Telegram WebApp ---
        function initTelegram() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand(); // Растягиваем на весь экран
                tg.ready();
                // Показываем кнопку закрытия
                tg.MainButton.setText("Закрыть");
                tg.MainButton.onClick(() => tg.close());
                tg.MainButton.show();
            }
        }

        // --- Запуск ---
        function init() {
            loadGame();
            renderBoard();
            initTelegram();
            document.getElementById('rollBtn').addEventListener('click', rollDice);
            document.getElementById('resetBtn').addEventListener('click', resetGame);
        }

        init();
    </script>
</body>
</html>
